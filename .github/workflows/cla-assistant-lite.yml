name: CLA Assistant Lite (reusable)

# Called by a short per-repo workflow (see agent-ix/agent-skills new-project
# scaffolding and rust-lib-cookiecutter for the caller template). Keeping the
# logic here means one edit fixes CLA enforcement everywhere it's wired up.
#
# Signatures are stored in the CALLING repo, not here, using that repo's own
# automatic GITHUB_TOKEN. There is no cross-repo credential: no PAT, no org
# secret, no expiry, no rotation. Accepted cost: a contributor signs once per
# repo they contribute to, rather than once org-wide. See
# scripts/gather-signatures.sh in this repo for a consolidated export across
# every repo when one is needed (e.g. for diligence).
#
# Signatures live on a dedicated `cla-signatures` branch in the calling repo,
# NOT on its default branch. Every repo in this org protects its default
# branch with required PR review, and GITHUB_TOKEN cannot push straight to a
# protected branch outside a reviewed PR merge -- confirmed by an actual
# failed run during PLAT-862 verification ("Changes must be made through a
# pull request"). The `ensure signatures branch exists` step below creates
# that unprotected branch on first use, off whatever the default branch's
# HEAD is at the time.
#
# Why this isn't just "call the vendor action directly": contributor-assistant/
# github-action's own sign-phrase matching is either (a) an exact string match
# against a fixed `custom-pr-sign-comment`, which can't include a variable
# legal name, or (b) a loose default regex that matches ANY comment containing
# the base phrase as a substring, which would accept a signature with no name
# at all. The `gate` job below does the actual legal-name validation and only
# ever hands the vendor action a `custom-pr-sign-comment` that already passed
# that check, so a bare "I hereby sign the CLA" with no name is never recorded
# as a signature.
#
# Agent-authored commits (`Agent IX <agent@agent-ix.dev>`) are not linked to
# any GitHub account, so GitHub's PR-commits API reports `author: null` for
# them and the vendor action has no login to test against its allowlist --
# they can never be "signed" no matter what. Codex-authored commits resolve
# to GitHub login `codex`, which likewise cannot sign on behalf of the human
# directing the contribution. The `internal` step below exempts a PR from CLA
# enforcement only when every commit has an approved internal identity and
# the PR itself was opened by an allowlisted login. Codex commits additionally
# require a named human sponsor. The opener condition is load-bearing: an
# unresolvable `author: null` commit is trivially forgeable by anyone (git
# author fields aren't verified), so email-matching alone would let an
# outside contributor claim `agent@agent-ix.dev` and skip the CLA. Requiring
# the PR opener to already be allowlisted means only an already-trusted
# identity can open a PR that benefits from the exemption.

on:
  workflow_call: {}

permissions:
  actions: write
  pull-requests: write
  issues: write
  statuses: write
  contents: write

env:
  # Sentinel that can never appear as a real signing comment. Handing this to
  # the vendor action as custom-pr-sign-comment means "don't accept any
  # comment as a new signature this run, just reconcile against the
  # already-recorded signature file." Used for pull_request_target runs (no
  # new comment to validate) and for `recheck`.
  NO_NEW_SIGNATURE_SENTINEL: __agent-ix-cla-recheck-only__
  CLA_DOCUMENT_URL: https://github.com/agent-ix/.github/blob/main/CLA.md
  SIGNATURES_BRANCH: cla-signatures
  # Logins exempt from signing (mirrors the vendor action's own allowlist
  # input below -- kept in one place here so the internal-PR check and the
  # vendor action agree).
  ALLOWLISTED_LOGINS: kreneskyp,agent-ix-bot,agent-ix[bot],dependabot[bot],github-actions[bot]
  # Raw commit-author emails treated as internal when GitHub can't resolve
  # them to a login at all (author: null). See the org's own commit history:
  # every commit reachable from --all in the publication candidates is one
  # of these two identities.
  INTERNAL_UNRESOLVABLE_EMAILS: agent@agent-ix.dev,kreneskyp@gmail.com
  # Only these human PR openers may sponsor the exact Codex commit identity.
  # Do not add `codex` to ALLOWLISTED_LOGINS: that vendor allowlist applies
  # even to PRs opened by outside contributors.
  INTERNAL_CODEX_SPONSORS: kreneskyp

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      sign-phrase: ${{ steps.match.outputs.sign-phrase }}
      skip-cla: ${{ steps.internal.outputs.skip-cla }}
    steps:
      - name: Exempt wholly-internal PRs from CLA enforcement
        id: internal
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ALLOWLISTED_LOGINS: ${{ env.ALLOWLISTED_LOGINS }}
          INTERNAL_UNRESOLVABLE_EMAILS: ${{ env.INTERNAL_UNRESOLVABLE_EMAILS }}
          INTERNAL_CODEX_SPONSORS: ${{ env.INTERNAL_CODEX_SPONSORS }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const pull_number = context.issue.number
            const allowlisted = new Set(
              process.env.ALLOWLISTED_LOGINS.split(',').map(s => s.trim())
            )
            const internalEmails = new Set(
              process.env.INTERNAL_UNRESOLVABLE_EMAILS.split(',').map(s => s.trim())
            )
            const codexSponsors = new Set(
              process.env.INTERNAL_CODEX_SPONSORS.split(',').map(s => s.trim())
            )

            const pr = await github.rest.pulls.get({ owner, repo, pull_number })
            const openerLogin = pr.data.user?.login
            // Load-bearing: only an already-trusted PR opener gets the
            // benefit of the doubt for internal agent commit authors below.
            if (!openerLogin || !allowlisted.has(openerLogin)) {
              core.setOutput('skip-cla', 'false')
              return
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number
            })
            const allInternal = commits.every(c => {
              const login = c.author?.login
              if (login && allowlisted.has(login)) return true
              if (login === 'codex' && codexSponsors.has(openerLogin) &&
                  c.commit?.author?.name === 'Codex' &&
                  c.commit?.author?.email === 'codex@openai.com') return true
              if (!c.author) {
                const email = c.commit?.author?.email
                if (email && internalEmails.has(email)) return true
              }
              return false
            })
            core.setOutput('skip-cla', allInternal ? 'true' : 'false')

      - name: Ensure signatures branch exists
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIGNATURES_BRANCH: ${{ env.SIGNATURES_BRANCH }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const branch = process.env.SIGNATURES_BRANCH
            try {
              await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })
              return // already exists
            } catch (err) {
              if (err.status !== 404) throw err
            }
            const defaultBranch = (await github.rest.repos.get({ owner, repo })).data.default_branch
            const head = await github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` })
            await github.rest.git.createRef({
              owner, repo, ref: `refs/heads/${branch}`, sha: head.data.object.sha
            })

      - name: Validate signing comment carries a legal name
        id: match
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const SENTINEL = process.env.NO_NEW_SIGNATURE_SENTINEL
            if (context.eventName !== 'issue_comment') {
              core.setOutput('sign-phrase', SENTINEL)
              return
            }
            const body = (context.payload.comment.body || '').trim()
            if (body.toLowerCase() === 'recheck') {
              core.setOutput('sign-phrase', SENTINEL)
              return
            }
            // Required, exact shape: the fixed CLA sign phrase followed by a
            // mandatory, non-empty legal name. Anything else (missing name,
            // reworded phrase, name-only reply) does not count as a
            // signature and is never forwarded to the vendor action.
            const re = /^i have read the cla document and i hereby sign the cla\.\s*my legal name is:\s*(.+\S)\s*$/i
            const m = body.match(re)
            if (!m) {
              core.setOutput('sign-phrase', SENTINEL)
              return
            }
            core.setOutput('sign-phrase', body)
            core.setOutput('legal-name', m[1].trim())

      - name: Record legal name in the audit trail
        if: steps.match.outputs.legal-name != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LEGAL_NAME: ${{ steps.match.outputs.legal-name }}
          CLA_DOCUMENT_URL: ${{ env.CLA_DOCUMENT_URL }}
          SIGNATURES_BRANCH: ${{ env.SIGNATURES_BRANCH }}
        with:
          script: |
            // Audit record is written into THIS repo (the one the PR was
            // opened against) on its dedicated, unprotected cla-signatures
            // branch, using the run's own automatic GITHUB_TOKEN.
            const path = 'signatures/version1/legal-names.json'
            const owner = context.repo.owner
            const repo = context.repo.repo
            const branch = process.env.SIGNATURES_BRANCH

            // Pin "which text version" to the actual blob SHA of the
            // canonical CLA.md at the moment of signing. This is a public
            // read against agent-ix/.github and needs no credential.
            const claFile = await github.rest.repos.getContent({
              owner: 'agent-ix', repo: '.github', path: 'CLA.md', ref: 'main'
            })

            let sha
            let records = []
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch })
              sha = existing.data.sha
              records = JSON.parse(Buffer.from(existing.data.content, 'base64').toString('utf8'))
            } catch (err) {
              if (err.status !== 404) throw err
            }

            records.push({
              githubLogin: context.payload.comment.user.login,
              legalName: process.env.LEGAL_NAME,
              repo: `${owner}/${repo}`,
              pullRequest: context.issue.number,
              commentId: context.payload.comment.id,
              claDocumentUrl: process.env.CLA_DOCUMENT_URL,
              claDocumentSha: claFile.data.sha,
              signedAt: context.payload.comment.created_at
            })

            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch,
              message: `Record CLA signature: ${context.payload.comment.user.login} in ${owner}/${repo}#${context.issue.number}`,
              content: Buffer.from(JSON.stringify(records, null, 2) + '\n').toString('base64'),
              sha
            })

  cla-check-internal:
    needs: gate
    if: needs.gate.outputs.skip-cla == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Every commit on this PR is from an allowlisted login or an unresolvable internal author (e.g. Agent IX <agent@agent-ix.dev>), and the PR was opened by an allowlisted login. Not an outside contribution; CLA not required."

  cla-check:
    needs: gate
    if: needs.gate.outputs.skip-cla != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/agent-ix/.github/blob/main/CLA.md
          branch: ${{ env.SIGNATURES_BRANCH }}
          allowlist: ${{ env.ALLOWLISTED_LOGINS }}
          custom-pr-sign-comment: ${{ needs.gate.outputs.sign-phrase }}
          custom-notsigned-prcomment: >-
            Thanks for the contribution. Before this can be merged, please read the
            [Agent IX CLA](https://github.com/agent-ix/.github/blob/main/CLA.md) and sign
            it by replying with this exact comment, with your real legal name in place of
            the bracketed text:


            I have read the CLA Document and I hereby sign the CLA. My legal name is: [Your Legal Name]
          custom-allsigned-prcomment: All contributors have signed the Agent IX CLA.
          lock-pullrequest-aftermerge: true
          suggest-recheck: true
